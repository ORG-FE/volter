services:
  warp:
    image: caomingjun/warp
    container_name: volter-warp
    restart: unless-stopped
    devices:
      - /dev/net/tun
    device_cgroup_rules:
      - 'c 10:200 rwm'
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.accept_ra=2
    environment:
      - WARP_SLEEP=5
      - WARP_ENABLE_NAT=1
      - GOST_ARGS=
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    ports:
      - "${VOLTER_PORT:-25565}:${VOLTER_PORT:-25565}"
      - "${VOLTER_QUIC_PORT:-4433}:${VOLTER_QUIC_PORT:-4433}/udp"
      - "${CONTROL_PORT:-8088}:${CONTROL_PORT:-8088}"

  volter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volter-server
    restart: unless-stopped
    network_mode: "service:warp"
    depends_on:
      warp:
        condition: service_started
    environment:
      - TOKEN=${TOKEN:-}
      - CONNECTION_KEY=${CONNECTION_KEY:-}
      - PUBLIC_HOST=${PUBLIC_HOST}
      - LISTEN_PORTS=${VOLTER_PORT:-25565}
      - SERVER_MODE=${SERVER_MODE:-both}
      - QUIC_LISTEN_PORT=${VOLTER_QUIC_PORT:-4433}
      - DEBUG=${DEBUG:-false}
      - CONTROL_PANEL=${CONTROL_PANEL:-false}
      - CONTROL_PORT=${CONTROL_PORT:-8088}
    volumes:
      - volter-certs:/app/certs
      - volter-data:/app/data

volumes:
  warp-data:
  volter-certs:
  volter-data:
